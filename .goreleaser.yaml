version: 2

project_name: cans

builds:
  - id: cans
    main: ./cmd/cans
    binary: cans
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/veronica-agent/cans/internal/ship.Version={{.Version}}

archives:
  - id: cans-archive
    ids: [cans]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: veronica-agent
    name: cans
  extra_files:
    - glob: ./install.sh
  prerelease: auto

homebrew_casks:
  - name: cans
    ids: [cans-archive]
    binaries:
      - cans
    repository:
      owner: veronica-agent
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/veronica-agent/cans
    description: Type a line. She speaks it.
    dependencies:
      - formula: uv
    custom_block: |
      depends_on macos: ">= :ventura"
      depends_on arch: :arm64
    caveats: |
      Apple Silicon. First run: cans doctor
      Then: cans
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cans"]
          end
    commit_msg_template: "cans {{ .Tag }}"
    # Set TAP_GITHUB_TOKEN on the release workflow to push Casks/cans.rb to the tap.
    skip_upload: true
